<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Quiz | Healingzion MGT</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a1128; --navy-light:#131c3a; --gold:#d4af37;
    --slate:#8a93ab; --white:#ffffff; --green:#3d9970; --red:#e07a5f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy);color:var(--white);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Playfair Display',serif;}
  a{color:var(--gold);text-decoration:none;}

  nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6vw;border-bottom:1px solid rgba(212,175,55,.2);flex-wrap:wrap;row-gap:10px;}
  nav .brand{font-family:'Playfair Display',serif;font-weight:700;font-size:1.2rem;}
  nav .brand span{color:var(--gold);font-style:italic;}
  nav .links a{margin-left:22px;font-size:.9rem;color:var(--white);}
  nav .links a:hover{color:var(--gold);}

  .wrap{max-width:640px;margin:0 auto;padding:50px 6vw 80px;text-align:center;}
  .eyebrow{color:var(--gold);letter-spacing:2px;font-size:.75rem;text-transform:uppercase;}
  .wrap h1{font-size:2rem;margin:10px 0 6px;}
  .wrap p.lede{color:var(--slate);margin:0 0 30px;}

  .mode-select{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:36px;}
  .mode-btn{
    background:var(--navy-light);border:1.5px solid rgba(212,175,55,.35);color:var(--white);
    padding:14px 26px;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .mode-btn.active{border-color:var(--gold);background:rgba(212,175,55,.12);color:var(--gold);}

  #quizArea{display:none;}
  #quizArea.show{display:block;}

  .progress{color:var(--slate);font-size:.85rem;margin-bottom:18px;}
  .score-live{color:var(--gold);font-weight:600;}

  .question-card{
    background:var(--navy-light);border:1px solid rgba(212,175,55,.2);border-radius:16px;
    padding:36px 28px;margin-bottom:24px;opacity:0;transform:translateY(8px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .question-card.in{opacity:1;transform:translateY(0);}
  .flag-display img{width:180px;max-width:80%;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.4);}
  .country-display{font-family:'Playfair Display',serif;font-size:1.6rem;margin:10px 0 4px;}
  .question-sub{color:var(--slate);font-size:.85rem;margin-bottom:0;}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
  .opt-btn{
    background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);color:var(--white);
    padding:14px 10px;border-radius:10px;font-size:.92rem;cursor:pointer;font-family:'Inter',sans-serif;
    transition:border-color .2s ease, background .2s ease;
  }
  .opt-btn:hover:not(:disabled){border-color:var(--gold);}
  .opt-btn.correct{background:rgba(61,153,112,.2);border-color:var(--green);color:var(--green);}
  .opt-btn.wrong{background:rgba(224,122,95,.2);border-color:var(--red);color:var(--red);}
  .opt-btn:disabled{cursor:default;}

  #resultCard{display:none;text-align:center;}
  #resultCard.show{display:block;}
  #resultCard .big-score{font-family:'Playfair Display',serif;font-size:3rem;color:var(--gold);margin:10px 0;}
  #resultCard .tier{font-size:1.1rem;color:var(--white);margin-bottom:24px;}
  .btn-primary{background:var(--gold);color:var(--navy);border:none;padding:13px 30px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem;font-family:'Inter',sans-serif;}
  .btn-ghost{background:none;border:1.5px solid rgba(212,175,55,.4);color:var(--gold);padding:12px 26px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem;font-family:'Inter',sans-serif;margin-left:10px;}

  .loading{color:var(--slate);padding:40px 0;}
  .quit-btn{background:none;border:none;color:var(--red);font-size:.8rem;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:underline;padding:0;}
  #quitMsg{display:none;color:var(--slate);padding:30px 0;}
  #quitMsg.show{display:block;}
</style>
</head>
<body>

<nav>
  <div class="brand">Healingzion <span>MGT</span></div>
  <div class="links">
    <a href="/resources.html">Resource Library</a>
    <a href="/resources.html#tiers">Membership</a>
    <a href="/about.html">About</a>
    <a href="/global-affairs.html">Global Affairs</a>
    <a href="/flag-quiz.html">Flag Quiz</a>
  </div>
</nav>

<div class="wrap">
  <div class="eyebrow">Free For Everyone</div>
  <h1>Flag Quiz</h1>
  <p class="lede">Test how well you know the world — pick a mode and start playing.</p>

  <div class="mode-select" id="modeSelect">
    <button class="mode-btn active" onclick="setMode('flag')" id="modeFlagBtn">🏳️ Guess the Flag</button>
    <button class="mode-btn" onclick="setMode('capital')" id="modeCapitalBtn">🏙️ Guess the Capital</button>
    <button class="mode-btn" onclick="setMode('leader')" id="modeLeaderBtn">🧑‍💼 Guess the Leader</button>
    <button class="mode-btn" onclick="setMode('currency')" id="modeCurrencyBtn">💰 Guess the Currency</button>
  </div>

  <div id="loadingMsg" class="loading">Loading countries…</div>

  <div id="quizArea">
    <div class="progress">
      Question <span id="qNum">1</span> / <span id="qTotal">10</span> &nbsp;·&nbsp; Score: <span class="score-live" id="liveScore">0</span>
      &nbsp;·&nbsp; <button class="quit-btn" onclick="quitQuiz()">✕ Quit</button>
    </div>
    <div class="question-card" id="questionCard">
      <div id="flagDisplay" class="flag-display"></div>
      <div id="countryDisplay" class="country-display"></div>
      <div class="question-sub" id="questionSub"></div>
      <div class="options" id="optionsGrid"></div>
    </div>
  </div>

  <div id="resultCard">
    <div class="eyebrow">Round Complete</div>
    <div class="big-score" id="finalScore">0 / 10</div>
    <div class="tier" id="tierLabel"></div>
    <button class="btn-primary" onclick="startQuiz()">Play Again</button>
    <button class="btn-ghost" onclick="switchModeFromResult()">Try Other Mode</button>
  </div>

  <div id="quitMsg">Round stopped. Pick a mode above to play again.</div>
</div>

<script>
const QUESTIONS_PER_ROUND = 10;
let allCountries = [];
let leaderCountries = []; // countries with a resolvable current leader, for 'leader' mode
let currencyCountries = []; // countries with usable currency data, for 'currency' mode
let mode = 'flag'; // 'flag', 'capital', 'leader', or 'currency'
let quizSet = [];
let currentIndex = 0;
let score = 0;
let leadersLoading = false;

async function loadCountries(){
  const statusEl = document.getElementById('loadingMsg');
  try{
    const res = await fetch('https://cdn.jsdelivr.net/gh/mledoze/countries/countries.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    // Keep only countries with a usable capital + name + code (needed for flag/capital modes)
    allCountries = data.filter(c => c.cca2 && c.name && c.name.common && c.capital && c.capital[0]);
    currencyCountries = allCountries.filter(c => c.currencies && Object.keys(c.currencies).length > 0)
      .map(c => {
        const code = Object.keys(c.currencies)[0];
        return Object.assign({}, c, { currencyCode: code, currencyName: c.currencies[code].name });
      });
    statusEl.style.display = 'none';
    startQuiz();
  }catch(e){
    console.error('Failed to load countries', e);
    statusEl.textContent = '⚠️ Could not load quiz data. Check your connection and reload the page.';
  }
}

// Fetched once, only when "Guess the Leader" is first opened — public Wikidata
// lookup, no login or backend needed for this free page.
const LEADER_CACHE_KEY = 'hz_leader_cache_v2';
const LEADER_CACHE_TTL = 24 * 60 * 60 * 1000; // 24h — leader data doesn't change often

function readLeaderCache(){
  try{
    const raw = localStorage.getItem(LEADER_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.byIso || (Date.now() - parsed.savedAt) > LEADER_CACHE_TTL) return null;
    return parsed.byIso;
  }catch(e){ return null; }
}

function writeLeaderCache(byIso){
  try{
    localStorage.setItem(LEADER_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), byIso }));
  }catch(e){ /* storage unavailable/full — safe to ignore, it's just a cache */ }
}

async function loadLeaders(){
  if(leaderCountries.length > 0 || leadersLoading) return;
  leadersLoading = true;
  const statusEl = document.getElementById('loadingMsg');
  statusEl.style.display = 'block';
  statusEl.textContent = 'Loading current leaders…';

  // Try the cache first — the live query below is heavy on Wikidata's public
  // endpoint, so avoid re-running it every time the mode is opened.
  const cached = readLeaderCache();
  if(cached){
    leaderCountries = allCountries
      .filter(c => cached[c.cca2])
      .map(c => Object.assign({}, c, { leaderName: cached[c.cca2] }));
    if(leaderCountries.length >= 4){
      statusEl.style.display = 'none';
      leadersLoading = false;
      return;
    }
  }

  // Only current heads of state (statements with no end-time qualifier),
  // limited to a sane result size — the previous unfiltered query pulled
  // every historical head of state for every country ever, which made the
  // request (and its label lookups) heavy enough to routinely time out or
  // hang with no visible error.
  const query = `
    SELECT ?isoCode ?headLabel WHERE {
      ?country wdt:P31 wd:Q6256;
               wdt:P297 ?isoCode;
               p:P35 ?headStmt.
      ?headStmt ps:P35 ?head.
      FILTER NOT EXISTS { ?headStmt pq:P582 ?endTime. }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
    }
    LIMIT 300`;
  const url = 'https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(query);

  // A hard timeout so a slow/hung request always falls into the error path
  // instead of leaving "Loading current leaders…" on screen forever.
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);

  try{
    const res = await fetch(url, {
      headers: { 'Accept': 'application/sparql-results+json' },
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const byIso = {};
    json.results.bindings.forEach(row => {
      const iso = row.isoCode.value;
      const head = row.headLabel.value;
      if(!byIso[iso]) byIso[iso] = head; // first result per country
    });
    leaderCountries = allCountries
      .filter(c => byIso[c.cca2])
      .map(c => Object.assign({}, c, { leaderName: byIso[c.cca2] }));
    writeLeaderCache(byIso);
    statusEl.style.display = 'none';
  }catch(e){
    clearTimeout(timeoutId);
    console.error('Failed to load leaders', e);
    // Fall back to a stale cache rather than a bare error, if we have one.
    if(cached && leaderCountries.length === 0){
      leaderCountries = allCountries
        .filter(c => cached[c.cca2])
        .map(c => Object.assign({}, c, { leaderName: cached[c.cca2] }));
    }
    if(leaderCountries.length >= 4){
      statusEl.style.display = 'none';
    } else if(e.name === 'AbortError'){
      statusEl.textContent = '⚠️ Leader data is taking too long to load. Please try again in a moment.';
    } else {
      statusEl.textContent = '⚠️ Could not load leader data. Check your connection and try again.';
    }
  }
  leadersLoading = false;
}

async function setMode(m){
  mode = m;
  document.getElementById('modeFlagBtn').classList.toggle('active', m === 'flag');
  document.getElementById('modeCapitalBtn').classList.toggle('active', m === 'capital');
  document.getElementById('modeLeaderBtn').classList.toggle('active', m === 'leader');
  document.getElementById('modeCurrencyBtn').classList.toggle('active', m === 'currency');
  document.getElementById('quitMsg').classList.remove('show');

  if(m === 'leader' && leaderCountries.length === 0){
    document.getElementById('quizArea').classList.remove('show');
    await loadLeaders();
    if(leaderCountries.length === 0) return; // failed to load, message already shown
  }
  startQuiz();
}

function quitQuiz(){
  document.getElementById('quizArea').classList.remove('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('quitMsg').classList.add('show');
}

function switchModeFromResult(){
  const order = ['flag', 'capital', 'leader', 'currency'];
  const next = order[(order.indexOf(mode) + 1) % order.length];
  setMode(next);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function poolForMode(m){
  if(m === 'leader') return leaderCountries;
  if(m === 'currency') return currencyCountries;
  return allCountries;
}

function startQuiz(){
  const pool = poolForMode(mode);
  if(pool.length < 4) return; // not enough data yet
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('quitMsg').classList.remove('show');
  document.getElementById('quizArea').classList.add('show');
  quizSet = shuffle(pool).slice(0, QUESTIONS_PER_ROUND);
  currentIndex = 0;
  score = 0;
  document.getElementById('qTotal').textContent = quizSet.length;
  document.getElementById('liveScore').textContent = score;
  renderQuestion();
}

function renderQuestion(){
  const card = document.getElementById('questionCard');
  card.classList.remove('in');

  const correct = quizSet[currentIndex];
  const pool = poolForMode(mode);
  const distractors = mode === 'currency'
    ? shuffle(pool.filter(c => c.currencyCode !== correct.currencyCode)).slice(0, 3)
    : shuffle(pool.filter(c => c.cca2 !== correct.cca2)).slice(0, 3);
  const options = shuffle([correct, ...distractors]);

  document.getElementById('qNum').textContent = currentIndex + 1;

  const flagEl = document.getElementById('flagDisplay');
  const countryEl = document.getElementById('countryDisplay');
  const subEl = document.getElementById('questionSub');
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';

  if(mode === 'flag'){
    flagEl.style.display = 'block';
    countryEl.style.display = 'none';
    flagEl.innerHTML = '<img src="https://flagcdn.com/w320/' + correct.cca2.toLowerCase() + '.png" alt="flag">';
    subEl.textContent = 'Which country does this flag belong to?';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt.name.common;
      btn.onclick = () => selectAnswer(btn, opt.cca2 === correct.cca2, correct.name.common);
      grid.appendChild(btn);
    });
  } else if(mode === 'capital'){
    flagEl.style.display = 'none';
    countryEl.style.display = 'block';
    countryEl.textContent = correct.name.common;
    subEl.textContent = 'What is the capital of this country?';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt.capital[0];
      btn.onclick = () => selectAnswer(btn, opt.cca2 === correct.cca2, correct.capital[0]);
      grid.appendChild(btn);
    });
  } else if(mode === 'leader'){
    flagEl.style.display = 'none';
    countryEl.style.display = 'block';
    countryEl.textContent = correct.leaderName;
    subEl.textContent = 'Which country does this leader lead?';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt.name.common;
      btn.onclick = () => selectAnswer(btn, opt.cca2 === correct.cca2, correct.name.common);
      grid.appendChild(btn);
    });
  } else { // currency mode
    flagEl.style.display = 'none';
    countryEl.style.display = 'block';
    countryEl.textContent = correct.currencyName;
    subEl.textContent = 'Which country uses this currency?';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt.name.common;
      btn.onclick = () => selectAnswer(btn, opt.cca2 === correct.cca2, correct.name.common);
      grid.appendChild(btn);
    });
  }

  requestAnimationFrame(() => card.classList.add('in'));
}

function selectAnswer(btn, isCorrect, correctLabel){
  const buttons = document.querySelectorAll('.opt-btn');
  buttons.forEach(b => b.disabled = true);

  if(isCorrect){
    btn.classList.add('correct');
    score++;
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b => { if(b.textContent === correctLabel) b.classList.add('correct'); });
  }
  document.getElementById('liveScore').textContent = score;

  setTimeout(() => {
    currentIndex++;
    if(currentIndex < quizSet.length){
      renderQuestion();
    } else {
      showResult();
    }
  }, 1100);
}

function showResult(){
  document.getElementById('quizArea').classList.remove('show');
  const resultCard = document.getElementById('resultCard');
  resultCard.classList.add('show');
  document.getElementById('finalScore').textContent = score + ' / ' + quizSet.length;

  let tier;
  const pct = score / quizSet.length;
  if(pct === 1) tier = '🌍 World Master — perfect score!';
  else if(pct >= 0.8) tier = '🏆 Geography Expert';
  else if(pct >= 0.5) tier = '👍 Well Traveled';
  else tier = '🧭 Keep Exploring';
  document.getElementById('tierLabel').textContent = tier;
}

loadCountries();
</script>

</body>
</html>
