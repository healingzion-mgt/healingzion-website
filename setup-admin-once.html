<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One-time setup</title>
<style>
  body { font-family: Arial, sans-serif; background: #0a1128; color: #d9dce3; padding: 30px 20px; }
  input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 5px; border: 1px solid #24304f; background: #101a3a; color: #f4f1ea; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background: #d4af37; color: #0a1128; border: none; border-radius: 5px; font-weight: bold; }
  #result { margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
  <h2>One-time: create D1 admin account</h2>
  <p>Delete this file from your repo right after you use it.</p>
  <input type="email" id="email" placeholder="Admin email" value="oyibooyoma@gmail.com">
  <input type="password" id="password" placeholder="Choose a password">
  <button onclick="doSignup()">Create account</button>
  <div id="result"></div>

<script>
async function doSignup() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const resultEl = document.getElementById('result');
  resultEl.textContent = 'Working...';

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    resultEl.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    resultEl.textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
