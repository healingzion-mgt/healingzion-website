const GOLD_LIGHT = "#F2D879";
const GOLD_DARK = "#8a6c14";
const GREEN = "#4fbf7f";
const RED = "#e0553f";
const BLUE = "#4fb4ff";

const naira = (n) => "₦" + Number(n || 0).toLocaleString();

/* ---------------- API CLIENT ---------------- */
function useApi(token) {
  return useCallback(
    async (path, opts = {}) => {
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(API_BASE + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
      let data;
      try {
        data = await res.json();
      } catch {
        data = {};
      }
      if (!res.ok) throw new Error(data.error || "Something went wrong");
      return data;
    },
    [token]
  );
}

/* ---------------- SMALL UI PRIMITIVES ---------------- */
function Badge({ children, tone = "gold" }) {
  const tones = {
    gold: { bg: "rgba(212,175,55,0.18)", fg: GOLD },
    green: { bg: "rgba(79,191,127,0.18)", fg: GREEN },
    red: { bg: "rgba(224,85,63,0.18)", fg: RED },
    blue: { bg: "rgba(79,180,255,0.18)", fg: BLUE },
  };
  const t = tones[tone];
  return (
    <span style={{ background: t.bg, color: t.fg, fontSize: 11, fontWeight: 700, padding: "4px 10px", borderRadius: 8, letterSpacing: 0.3 }}>
      {children}
    </span>
  );
}

function Button({ children, onClick, variant = "primary", style, disabled }) {
  const base = { padding: "13px 18px", borderRadius: 12, fontWeight: 800, fontSize: 14, border: "none", cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.5 : 1, textAlign: "center" };
  const variants = {
    primary: { background: `linear-gradient(135deg, ${GOLD_LIGHT}, ${GOLD})`, color: NAVY },
    ghost: { background: "rgba(255,255,255,0.08)", color: "#fff", border: "1px solid rgba(255,255,255,0.18)" },
    danger: { background: "transparent", color: RED, border: `1.5px solid ${RED}` },
    success: { background: `linear-gradient(135deg,#5fd48f,#2f9e5e)`, color: NAVY },
  };
  return (
    <button disabled={disabled} onClick={onClick} style={{ ...base, ...variants[variant], ...style }}>
      {children}
    </button>
  );
}

function Card({ children, style, onClick }) {
  return <div onClick={onClick} style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(212,175,55,0.15)", borderRadius: 16, padding: 18, marginBottom: 14, ...style }}>{children}</div>;
}

function TopHeader({ title, onBack, right }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "26px 22px 18px", background: `linear-gradient(160deg, ${NAVY_MID}, ${NAVY})`, justifyContent: "space-between" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        {onBack && (
          <div onClick={onBack} style={{ width: 34, height: 34, borderRadius: "50%", background: "rgba(255,255,255,0.08)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
            ←

function Input({ label, value, onChange, placeholder, type = "text" }) {
  // Mobile keyboards auto-capitalize the first letter of a plain text field
  // by default — for an email field that silently turns "name@x.com" into
  // "Name@x.com" as someone types, which can create what looks like a
  // duplicate account if the backend ever compares emails case-sensitively.
  // Disable that (and autocorrect/spellcheck) specifically for email inputs.
  const emailProps = type === "email" ? { autoCapitalize: "none", autoCorrect: "off", spellCheck: false } : {};
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 11.5, color: "#B9C2D6", fontWeight: 700, marginBottom: 6 }}>{label}</div>
      <input
        type={type}
        value={value}
        placeholder={placeholder}
        onChange={(e) => onChange(e.target.value)}
        {...emailProps}
        style={{ width: "100%", background: "rgba(255,255,255,0.06)", border: "1.5px solid rgba(212,175,55,0.35)", borderRadius: 12, padding: "13px 14px", fontSize: 14, color: "#fff", outline: "none", boxSizing: "border-box" }}
      />
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", fontSize: 13.5 }}>
      <div style={{ color: "#9aa5c0" }}>{label}</div>
      <div style={{ fontWeight: 700 }}>{value}</div>
    </div>
  );
}

function Select({ label, value, onChange, options, placeholder }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 11.5, color: "#B9C2D6", fontWeight: 700, marginBottom: 6 }}>{label}</div>
      <select
        value={value}
        onChange={(e) => onChange(e.target.value)}
        style={{ width: "100%", background: "rgba(255,255,255,0.06)", border: "1.5px solid rgba(212,175,55,0.35)", borderRadius: 12, padding: "13px 14px", fontSize: 14, color: value ? "#fff" : "#7d88a3", outline: "none", boxSizing: "border-box", appearance: "none" }}
      >
        <option value="" style={{ color: "#000" }}>{placeholder || "Select..."}</option>
        {options.map((o) => {
          const opt = typeof o === "object" ? o : { value: o, label: o };
          return (
            <option key={opt.value} value={opt.value} style={{ color: "#000" }}>{opt.label}</option>
          );
        })}
      </select>
    </div>
  );
}

// Requests browser notification permission, gets an FCM device token, and
// registers it with the backend against the logged-in user. Uses a
// dedicated service-worker scope ("/firebase-cloud-messaging-push-scope")
// so it never conflicts with the existing service-worker.js (PWA caching).
// Safe to call repeatedly — silently no-ops if unsupported, already
// registered, or permission is denied. Runs silently in production; any
// failure is logged to the console only, never surfaced to the user.
async function setupPushNotifications(apiCall) {
  try {
    if (!("Notification" in window) || !("serviceWorker" in navigator)) return;
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);

    const permission = await Notification.requestPermission();
    if (permission !== "granted") return;

    const registration = await navigator.serviceWorker.register(
      "firebase-messaging-sw.js",
      { scope: "/firebase-cloud-messaging-push-scope" }
    );
    const messaging = firebase.messaging();

    const token = await messaging.getToken({ vapidKey: FIREBASE_VAPID_KEY, serviceWorkerRegistration: registration });
    if (token) {
      await apiCall("/api/notifications/register-token", {
        method: "POST",
        body: JSON.stringify({ token }),
      });
    }
  } catch (e) {
    console.log("Push setup failed:", e && e.message ? e.message : e);
  }
}

  function compressImageFile(file, maxDim = 1080, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

    if (!file) return;

  async function openProviderInquiryThread(serviceId, customerId) {
    setSelectedInquiryThread({ serviceId, customerId });
    setScreen("provider-inquiry-thread");
    try {
      const d = await api(`/api/provider/inquiries/${serviceId}/${customerId}`);
      setProviderInquiryMessages(d.messages || []);
    } catch (e) { showToast(e.message); }
  }
  async function sendProviderInquiryReply() {
    if (!providerInquiryReplyDraft.trim() || !selectedInquiryThread || sendingProviderInquiryReply) return;
    setSendingProviderInquiryReply(true);
    try {
      const { serviceId, customerId } = selectedInquiryThread;
      await api(`/api/provider/inquiries/${serviceId}/${customerId}/reply`, { method: "POST", body: JSON.stringify({ body: providerInquiryReplyDraft.trim() }) });
      setProviderInquiryReplyDraft("");
      await openProviderInquiryThread(serviceId, customerId);
      await loadProviderInquiryThreads();
    } catch (e) { showToast(e.message); }
    setSendingProviderInquiryReply(false);
  }
  async function submitReview() {
    const o = selectedOrder;
    if (!o) return;
    if (!reviewForm.rating) { showToast("Tap a star to rate"); return; }
    try {
      await api(`/api/orders/${o.id}/review`, { method: "POST", body: JSON.stringify(reviewForm) });
      showToast("Thanks for your review!");
      setReviewForm({ rating: 0, comment: "" });
      await loadOrders();
      setScreen("orders");
    } catch (e) { showToast(e.message); }
  }
  async function submitDispute() {
    const o = selectedOrder;
    if (!o) return;
    if (!disputeForm.category) { showToast("Choose a reason category"); return; }
    if (!disputeForm.reason.trim()) { showToast("Describe what went wrong"); return; }
    try {
      const fullReason = `${disputeForm.category}: ${disputeForm.reason.trim()}`;
      await api(`/api/orders/${o.id}/reject`, { method: "POST", body: JSON.stringify({ reason: fullReason }) });
      showToast("Dispute submitted — an admin will review it");
      setDisputeForm({ category: "", reason: "" });
      await loadOrders();
      setScreen("orders");
    } catch (e) { showToast(e.message); }
  }
  async function loadOrderMessages(order) {
    try {
      const data = await api(`/api/orders/${order.id}/messages`);
      setOrderMessages(data.messages || []);
      setMessageThreadLocked(!!data.locked);
      setMessageMyRole(data.role);

  async function sendOrderMessage() {

  // ================================================================
  // FIND A SOLUTION SEARCH — lets a customer describe their problem in
  // plain language ("my fridge is leaking") and still find the right
  // category ("Air Conditioning/Fridge Repair"), tolerates small typos,
  // and ranks results by relevance instead of database order. Entirely
  // client-side against the already-loaded services list — no backend
  // change needed since /api/services already returns everything.
  // Extend SEARCH_SYNONYMS whenever a new category is added that
  // customers are likely to describe in everyday words rather than
  // its formal name.
  // ================================================================
  const SEARCH_SYNONYMS = {
    "Plumbing": ["pipe", "leak", "leaking pipe", "tap", "faucet", "toilet", "drainage", "drain", "burst pipe", "water leak", "plumber"],
    "Cleaning": ["cleaner", "clean my house", "housekeeping", "sanitize", "mop", "sweep", "deep clean"],
    "Electrical": ["electrician", "wiring", "power issue", "socket", "switch", "no light", "light not working", "fuse", "generator wiring"],
    "Carpentry": ["carpenter", "wood work", "furniture repair", "door repair", "cabinet", "shelf", "wardrobe"],
    "Painting": ["painter", "paint job", "wall paint", "repaint", "house painting"],
    "Construction": ["builder", "building work", "renovation", "mason", "block work", "contractor"],
    "Landscaping": ["gardener", "lawn", "grass cutting", "garden work"],
    "Graphics & Design": ["designer", "logo design", "flyer design", "graphic design"],
    "Transport & Logistics": ["delivery", "dispatch rider", "moving service", "courier", "haulage", "truck"],
    "Laundry Services": ["laundry", "washing clothes", "dry cleaning", "ironing", "iron clothes"],
    "Air Conditioning/Fridge Repair": ["ac repair", "air conditioner", "fridge repair", "freezer repair", "ac not cooling", "fridge not cooling", "ac gas", "fridge leaking"],
    "Auto Mechanic & Repairs": ["mechanic", "car repair", "car not starting", "engine problem", "car service", "panel beater", "car wash", "vulcanizer"],
    "Catering & Event Planning": ["caterer", "event planner", "party food", "small chops", "wedding planning", "jollof rice"],
    "Fashion Design & Tailoring": ["tailor", "seamstress", "sew clothes", "fashion designer", "ankara style"],
    "Hair & Beauty (Salon, Makeup, Barbering)": ["hair stylist", "makeup artist", "barber", "salon", "braiding", "manicure", "pedicure"],
    "Health & Wellness (Fitness Trainers, Nutritionists)": ["gym trainer", "personal trainer", "nutritionist", "weight loss", "fitness coach"],
    "IT & Software Services": ["web developer", "app developer", "computer repair", "software engineer", "website design", "laptop repair"],
    "Interior Design & Decoration": ["interior designer", "home decor", "decorator"],
    "Photography & Videography": ["photographer", "videographer", "video coverage", "photo shoot"],
    "Music/Entertainment (DJs, MCs, Musicians)": ["dj", "mc", "musician", "live band", "event host", "compere"],
    "Accounting & Bookkeeping": ["accountant", "bookkeeper", "tax filing", "audit"],
    "Legal Services": ["lawyer", "attorney", "legal advice"],
    "Printing & Branding": ["printer", "print flyers", "branding", "banner printing", "print business cards"],
    "Real Estate & Property Management": ["realtor", "house for rent", "property manager", "land agent", "apartment for rent"],
    "Tutoring & Education Services": ["tutor", "home lesson", "exam prep", "private teacher"],
    "Farming & Agro Services": ["farmer", "agriculture", "farm produce"],
    "Fumigation & Pest Control": ["pest control", "fumigator", "rodent", "termite", "cockroach"],
  };

  // Small edit-distance check so short misspellings ("electrican",
  // "mechanik") still match — capped at 1 substitution/insertion/deletion,
  // and only applied to words long enough that a false match is unlikely.
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (Math.abs(m - n) > 2) return 99;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
      }
    }
    return dp[m][n];
  }
  function fuzzyIncludes(text, q) {
    if (!text || !q) return false;
    const t = text.toLowerCase();
    if (t.includes(q)) return true;
    if (q.length < 5) return false; // too short to safely fuzzy-match
    return t.split(/\s+/).some((word) => word.length >= 5 && levenshtein(word, q) <= 1);
  }

  // Categories whose name OR any synonym phrase relates to the query —
  // matched loosely in both directions so "ac" finds "ac repair" and
  // "air conditioner repair" still finds the "ac repair" synonym.
  function synonymCategoriesFor(q) {
    const matched = new Set();
    if (!q) return matched;
    for (const [cat, terms] of Object.entries(SEARCH_SYNONYMS)) {
      if (fuzzyIncludes(cat, q)) { matched.add(cat); continue; }
      if (terms.some((t) => t.includes(q) || q.includes(t) || fuzzyIncludes(t, q))) matched.add(cat);
    }
    return matched;
  }

  function relevanceScore(s, q, synCats) {
    const title = (s.title || "").toLowerCase();
    const cat = (s.category || "").toLowerCase();
    const biz = (s.business_name || "").toLowerCase();
    const desc = (s.description || "").toLowerCase();
    let score = 0;
    if (title === q) score += 100;
    else if (title.startsWith(q)) score += 60;
    else if (title.includes(q)) score += 40;
    else if (fuzzyIncludes(title, q)) score += 25;
    if (cat.includes(q)) score += 30;
    if (synCats.has(s.category)) score += 25;
    if (biz.includes(q)) score += 15;
    if (desc.includes(q)) score += 8;
    return score;
  }

  function filterAndSortServices(list) {
    let out = list;
    const q = marketplaceSearch.trim().toLowerCase();
    let synCats = new Set();
    if (q) {
      synCats = synonymCategoriesFor(q);
      out = out.filter((s) =>
        fuzzyIncludes(s.title, q) ||
        fuzzyIncludes(s.business_name, q) ||
        fuzzyIncludes(s.category, q) ||
        fuzzyIncludes(s.description, q) ||
        synCats.has(s.category)
      );
    }
    if (marketplaceAvailableOnly) {
      out = out.filter((s) => !!s.available_now);
    }
    const loc = marketplaceLocation.trim().toLowerCase();
    if (loc) {
      out = out.filter((s) => (s.location || "").toLowerCase().includes(loc));
    }
    const min = Number(marketplaceMinPrice);
    const max = Number(marketplaceMaxPrice);
    if (marketplaceMinPrice !== "" && !isNaN(min)) out = out.filter((s) => s.price >= min);
    if (marketplaceMaxPrice !== "" && !isNaN(max)) out = out.filter((s) => s.price <= max);
    out = [...out];
    if (marketplaceSort === "price_low") out.sort((a, b) => a.price - b.price);
    else if (marketplaceSort === "price_high") out.sort((a, b) => b.price - a.price);
    else if (marketplaceSort === "rating") out.sort((a, b) => (b.rating || 0) - (a.rating || 0));
    else if (q) out.sort((a, b) => relevanceScore(b, q, synCats) - relevanceScore(a, q, synCats));
    return out;
  }

  const QUICK_REPLIES = ["On my way", "Running a few minutes late", "Please confirm the address", "Sounds good"];
  function parseServerTime(iso) {
    // SQLite's datetime('now') returns "YYYY-MM-DD HH:MM:SS" in UTC with no
    // timezone marker. new Date() on that string is parsed as LOCAL time by
    // most browsers, silently dropping the UTC->local conversion. Normalize
    // to ISO8601 with a Z so it's parsed as UTC and converted correctly.
    if (!iso) return new Date();
    let s = iso;
    if (!s.includes("T")) s = s.replace(" ", "T");
    if (!s.endsWith("Z")) s += "Z";
    return new Date(s);
  }
  function formatMsgTime(iso) {
    const d = parseServerTime(iso);
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  function msgDayLabel(iso) {
    const d = parseServerTime(iso);
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const sameDay = (a, b) => a.toDateString() === b.toDateString();
    if (sameDay(d, today)) return "Today";
    if (sameDay(d, yesterday)) return "Yesterday";
    return d.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  async function shareProviderProfile(providerId) {
    const url = `${window.location.origin}${window.location.pathname}?provider=${providerId}`;
    const p = providerProfile && providerProfile.provider;
    const title = p ? p.business_name : "Healingzion Connect";
    const text = p ? `Check out ${p.business_name} on Healingzion Connect` : "Check out this provider on Healingzion Connect";
    if (navigator.share) {
      try {
        await navigator.share({ title, text, url });
        return;
      } catch (e) {
        // user cancelled the share sheet — fall through to nothing further
        if (e && e.name === "AbortError") return;
      }
    }
    try {
      await navigator.clipboard.writeText(url);
      showToast("Link copied — paste it anywhere to share");
    } catch (e) {
      showToast(url);
    }
  }

          (a.email || "").toLowerCase().includes(q) ||
          (a.business_name || "").toLowerCase().includes(q))
      : list;

      if (status === "Verified Provider") return GREEN;
      if (status === "Provider (Pending)") return GOLD;
      if (status === "Provider (Rejected)") return RED;
      return "#9aa5c0";
    };
    return (
      <>
        <TopHeader title="All Accounts" onBack={() => setScreen("admin")} />
        <div style={{ padding: 22 }}>
          <input
            value={accountsSearch}
            onChange={(e) => setAccountsSearch(e.target.value)}

          />
          {!allAccounts && <div style={{ color: "#7d88a3", fontSize: 12.5 }}>Loading…</div>}
          {allAccounts && (
            <div style={{ fontSize: 11.5, color: "#7d88a3", marginBottom: 10 }}>
              {filtered.length} of {list.length} account{list.length === 1 ? "" : "s"}

          )}
          {allAccounts && filtered.length === 0 && <div style={{ color: "#7d88a3", fontSize: 12.5 }}>No accounts match.</div>}
          {filtered.map((a) => (
            <Card key={a.id}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700 }}>{a.full_name}</div>
                  <div style={{ fontSize: 11.5, color: "#9aa5c0", wordBreak: "break-all" }}>{a.email}</div>
                  {a.business_name && <div style={{ fontSize: 11.5, color: "#7d88a3", marginTop: 2 }}>{a.business_name}</div>}
                </div>
                <div style={{ flexShrink: 0, textAlign: "right" }}>
                  <div style={{ fontSize: 10.5, fontWeight: 800, color: badgeColor(a.status), background: "rgba(255,255,255,0.06)", borderRadius: 20, padding: "4px 10px", whiteSpace: "nowrap" }}>

                    <div style={{ fontSize: 10, color: RED, fontWeight: 700, marginTop: 4 }}>🔒 Locked</div>
                  )}

              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8 }}>

                <Button
                  variant="danger"
                  style={{ padding: "6px 12px", fontSize: 11 }}
                  disabled={deletingAccountId === a.id}
                  onClick={() => {
                    if (window.confirm(`Permanently delete ${a.full_name}'s account? This can't be undone. (Accounts with order history can't be deleted this way — lock them instead.)`)) {
                      deleteAccount(a.id);

                </div>
              );
            })}
          </div>
          <div style={{ borderTop: "1px solid rgba(255,255,255,0.08)", padding: "10px 0 16px", display: "flex", gap: 8 }}>
            <input value={adminReplyDraft} onChange={(e) => setAdminReplyDraft(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") sendAdminReply(); }} placeholder="Type a reply..." style={{ flex: 1, background: "rgba(255,255,255,0.06)", border: "1.5px solid rgba(212,175,55,0.35)", borderRadius: 20, padding: "10px 16px", fontSize: 14, color: "#fff", outline: "none" }} />
            <Button style={{ padding: "10px 18px" }} disabled={sendingAdminReply || !adminReplyDraft.trim()} onClick={sendAdminReply}>Send</Button>
          </div>
        </div>
      </>
    );
  }

  function PriceFactorsScreen() {
    const covered = [
      { title: "Crude oil prices", desc: "Affects transport, logistics, and manufacturing costs across almost everything you buy or sell." },
      { title: "Currency exchange rate (USD → NGN)", desc: "Huge for Nigeria specifically — it directly affects the cost of anything imported, from equipment to raw materials." },
      { title: "Natural gas prices", desc: "Affects electricity generation, manufacturing, and fertilizer production costs." },
      { title: "Global food prices", desc: "Affects the cost of imported food staples and anything that depends on them." },
      { title: "Fuel prices", desc: "Affects transportation, logistics, and the cost of running generators — a big one in Nigeria specifically." },
      { title: "Inflation rate", desc: "The overall result of all these forces combined — the general rise in prices across the economy." },
    ];
    const notCovered = [
      { title: "Interest rates / monetary policy (CBN rate decisions)", desc: "Affects how expensive it is for businesses to borrow money — which eventually passes through to prices." },
      { title: "Local transportation & logistics costs", desc: "Fuel scarcity, bad roads, and tolls all add friction and cost to moving goods." },
      { title: "Government policy", desc: "Tariffs, import bans, and subsidy removals — the 2023 fuel subsidy removal is a recent example of how big this can be." },
      { title: "Agricultural conditions", desc: "Weather, insecurity in farming regions, and harvest yields directly affect food supply and price." },
      { title: "Labor costs & minimum wage changes", desc: "Rising wages increase the cost of running a business, which can be passed on to customers." },
      { title: "Global supply chain disruptions", desc: "Shipping delays and port congestion can create shortages that push prices up unexpectedly." },
      { title: "Money supply (how much Naira is in circulation)", desc: "More money circulating without matching growth in goods/services tends to push prices up over time." },
    ];
    return (
      <>
        <TopHeader title="What Affects Prices?" onBack={() => setScreen("market-dashboard")} />
        <div style={{ padding: 22 }}>
          <Card>
            <div style={{ fontSize: 13, color: "#c3cbe0", lineHeight: 1.6 }}>
              Before you invest, start a business, or make a big financial decision, it helps to understand what actually moves prices. Here's a fuller picture — some of it we track live above, and some of it is harder to put a number on, but just as real.
            </div>
          </Card>

          <div style={{ fontSize: 13, fontWeight: 800, color: GOLD, margin: "20px 0 10px", textTransform: "uppercase", letterSpacing: 0.5 }}>
            Already tracked in your dashboard
          </div>
          {covered.map((item) => (
            <Card key={item.title}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                <div style={{ color: GREEN, fontSize: 16, marginTop: 1 }}>✓</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{item.title}</div>
                  <div style={{ fontSize: 12.5, color: "#9aa5c0", marginTop: 4, lineHeight: 1.5 }}>{item.desc}</div>
                </div>
              </div>
            </Card>
          ))}

          <div style={{ fontSize: 13, fontWeight: 800, color: GOLD, margin: "24px 0 10px", textTransform: "uppercase", letterSpacing: 0.5 }}>
            Other real factors, harder to track
          </div>
          {notCovered.map((item) => (
            <Card key={item.title}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                <div style={{ color: "#9aa5c0", fontSize: 16, marginTop: 1 }}>•</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{item.title}</div>
                  <div style={{ fontSize: 12.5, color: "#9aa5c0", marginTop: 4, lineHeight: 1.5 }}>{item.desc}</div>
                </div>
              </div>
            </Card>
          ))}

          <div style={{ fontSize: 11, color: "#7d88a3", textAlign: "center", marginTop: 20, lineHeight: 1.5 }}>
            This is general economic context, not financial advice — always do your own research or speak to a professional before making investment decisions.
          </div>
        </div>
      </>
    );
  }

  function MarketDashboardScreen() {
    return (
      <>
        <TopHeader title="Market Dashboard" onBack={() => setScreen("home")} right={<span onClick={() => setScreen("price-factors")} style={{ fontSize: 12.5, color: GOLD, fontWeight: 700, cursor: "pointer" }}>What affects prices?</span>} />
        <div style={{ padding: 22 }}>
          {marketLoading && <div style={{ color: "#9aa5c0", fontSize: 13, textAlign: "center", padding: "30px 0" }}>Loading market data…</div>}

          {!marketLoading && marketError && (
            <Card>
              <div style={{ color: RED, fontSize: 13, marginBottom: 10 }}>⚠️ {marketError}</div>
              <Button variant="ghost" onClick={loadMarketDashboard}>Try Again</Button>
            </Card>
          )}

          {!marketLoading && marketCurrency && (
            <Card>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 4 }}>💱 Currency Exchange Rates</div>
              <div style={{ fontSize: 11.5, color: "#7d88a3", marginBottom: 14 }}>Base: {marketCurrency.base} · As of {marketCurrency.date}</div>
              {Object.entries(marketCurrency.rates).map(([code, rate]) => (
                <div key={code} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                  <span style={{ fontSize: 13.5, color: "#c9cfe0" }}>{marketCurrency.base} → {code}</span>
                  <span style={{ fontSize: 13.5, fontWeight: 700 }}>{rate.toLocaleString(undefined, { maximumFractionDigits: 4 })}</span>
                </div>
              ))}
              <div style={{ fontSize: 10.5, color: "#7d88a3", marginBottom: 10, lineHeight: 1.5 }}>
                <b>NGN</b> = Nigerian Naira · <b>EUR</b> = Euro · <b>GBP</b> = British Pound.
                Each rate shows how much of that currency <b>1 {marketCurrency.base}</b> is worth right now.
                A bigger number means that currency is weaker (you get more of it per dollar); a smaller number means it's stronger.
              </div>
              {marketCurrency.projection ? (
                <div style={{ marginTop: 12, background: "rgba(212,175,55,0.08)", borderRadius: 10, padding: 12 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: GOLD, marginBottom: 3 }}>
                    Projected in {marketCurrency.projection.horizon_days} days: {marketCurrency.projection.projected_rate} {marketCurrency.projection.currency}
                  </div>
                  <div style={{ fontSize: 10.5, color: "#7d88a3" }}>{marketCurrency.projection.note}</div>
                </div>
              ) : marketCurrency.projection_note ? (
                <div style={{ fontSize: 10.5, color: "#7d88a3", marginTop: 10 }}>{marketCurrency.projection_note}</div>
              ) : null}
            </Card>
          )}

          {!marketLoading && marketGdp && (
            <Card>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 4 }}>🌍 GDP — Local &amp; Global</div>
              <div style={{ fontSize: 11.5, color: "#7d88a3", marginBottom: 8 }}>World Bank data, current US$</div>
              <div style={{ fontSize: 10.5, color: "#7d88a3", marginBottom: 14, lineHeight: 1.5 }}>
                <b>GDP</b> = the total value of all goods and services a country produced in one year. A bigger number means a bigger overall economy — it doesn't by itself mean people are richer, since it doesn't account for population size.
              </div>
              {Object.values(marketGdp).map((c) => (
                <div key={c.country} style={{ padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <span style={{ fontSize: 13.5, fontWeight: 700 }}>{c.country}</span>
                    <span style={{ fontSize: 13.5, color: "#c9cfe0" }}>{c.latest_year}</span>
                  </div>
                  <div style={{ fontSize: 13, color: GOLD_LIGHT, marginTop: 2 }}>
                    ${c.latest_gdp_usd ? (c.latest_gdp_usd / 1e9).toLocaleString(undefined, { maximumFractionDigits: 1 }) : "—"}B
                  </div>
                  {c.projection && (
                    <div style={{ fontSize: 10.5, color: "#7d88a3", marginTop: 3 }}>
                      {c.projection.for_year} projection: ${(c.projection.projected_gdp_usd / 1e9).toLocaleString(undefined, { maximumFractionDigits: 1 })}B — {c.projection.note}
                    </div>
                  )}
                </div>
              ))}
            </Card>
          )}

          {!marketLoading && marketCommodities && (
            <Card>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 4 }}>🛢️ Commodities &amp; Cost of Living</div>
              <div style={{ fontSize: 11.5, color: "#7d88a3", marginBottom: 8 }}>Source: FRED (Federal Reserve Economic Data)</div>
              <div style={{ fontSize: 10.5, color: "#7d88a3", marginBottom: 14, lineHeight: 1.5 }}>
                <b>Crude Oil</b> &amp; <b>Natural Gas</b>: the current market price per unit — when these rise, transport, electricity, and manufacturing costs tend to follow.
                <b> Food Price Index</b>: 100 = the 2016 average; above 100 means food costs more globally than in 2016.
                <b> Inflation Rate</b>: how much more expensive goods and services have become over the past year, on average.
              </div>
              {Object.values(marketCommodities).map((c) => (
                <div key={c.label} style={{ padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700 }}>{c.label}</div>
                  {c.error ? (
                    <div style={{ fontSize: 12, color: "#7d88a3", marginTop: 3 }}>{c.error}</div>
                  ) : (
                    <>
                      <div style={{ fontSize: 13, color: GOLD_LIGHT, marginTop: 2 }}>
                        {c.latest_value} {c.unit} <span style={{ color: "#7d88a3", fontSize: 11 }}>· as of {c.latest_date}</span>
                      </div>
                      {c.projection ? (
                        <div style={{ fontSize: 10.5, color: "#7d88a3", marginTop: 3 }}>
                          Projected next: {c.projection.projected_value} {c.unit} — {c.projection.note}
                        </div>
                      ) : c.projection_note ? (
                        <div style={{ fontSize: 10.5, color: "#7d88a3", marginTop: 3 }}>{c.projection_note}</div>
                      ) : null}
                    </>
                  )}
                </div>
              ))}
            </Card>
          )}

          <div style={{ fontSize: 10.5, color: "#5c6584", textAlign: "center", marginTop: 16, lineHeight: 1.5 }}>
            Rates, GDP, and commodity figures are from public data sources and refresh automatically. Projected figures are trend estimates only — not guarantees.
          </div>
        </div>
      </>
    );
  }

  const totalUnread = orders.reduce((sum, o) => sum + (o.unread_count || 0), 0);
  const custNav = [
    { key: "home", label: "Home" },
    { key: "orders", label: "Orders", badge: totalUnread },
    { key: "wallet", label: "Wallet" },
    { key: "profile", label: "Profile" },
  ];
  const adminNav = [
    { key: "home", label: "Home" },
    { key: "orders", label: "Orders" },
    { key: "wallet", label: "Wallet" },
    { key: "admin", label: "Admin" },
    { key: "profile", label: "Profile" },
  ];

  let body;
  let nav = me.role === "admin" ? adminNav : custNav;
  let active = screen;

  if (screen === "payment") body = PaymentScreen();
  else if (screen === "review") body = ReviewScreen();
  else if (screen === "dispute") body = DisputeScreen();
  else if (screen === "brand-media") body = BrandMediaScreen();
  else if (screen === "messages") body = MessagesScreen();
  else if (screen === "marketplace") body = MarketplaceScreen();
  else if (screen === "market-dashboard") body = MarketDashboardScreen();
  else if (screen === "price-factors") body = PriceFactorsScreen();
  else if (screen === "category-services") body = CategoryServicesScreen();
  else if (screen === "notifications") body = NotificationsScreen();
  else if (screen === "become-provider") body = BecomeProviderScreen();
  else if (screen === "add-service") body = AddServiceScreen();
  else if (screen === "my-services") body = MyServicesScreen();
  else if (screen === "provider-profile") body = ProviderProfileScreen();
  else if (screen === "request-name-change") body = RequestNameChangeScreen();
  else if (screen === "admin-name-change-requests") { body = AdminNameChangeRequestsScreen(); active = "admin"; }
  else if (screen === "feedback") body = FeedbackScreen();
  else if (screen === "provider-feedback") body = ProviderFeedbackScreen();
  else if (screen === "edit-service") body = EditServiceScreen();
  else if (screen === "investments") body = InvestmentsScreen();
  else if (screen === "investment-detail") body = InvestmentDetailScreen();
  else if (screen === "my-investments") body = MyInvestmentsScreen();
  else if (screen === "academy") body = AcademyScreen();
  else if (screen === "course-detail") body = CourseDetailScreen();
  else if (screen === "my-courses") body = MyCoursesScreen();
  else if (screen === "events") body = EventsScreen();
  else if (screen === "event-detail") body = EventDetailScreen();
  else if (screen === "my-events") body = MyEventsScreen();
  else if (screen === "grow-sessions") body = GrowSessionsScreen();
  else if (screen === "grow-session-detail") body = GrowSessionDetailScreen();
  else if (screen === "my-grow-sessions") body = MyGrowSessionsScreen();
  else if (screen === "create-grow-session") { body = CreateGrowSessionScreen(); active = "admin"; }
  else if (screen === "manage-grow-sessions") { body = ManageGrowSessionsScreen(); active = "admin"; }
  else if (screen === "edit-grow-session") { body = EditGrowSessionScreen(); active = "admin"; }
  else if (screen === "admin-grow-bookings") { body = AdminGrowBookingsScreen(); active = "admin"; }
  else if (screen === "create-investment") { body = CreateInvestmentScreen(); active = "admin"; }
  else if (screen === "create-course") { body = CreateCourseScreen(); active = "admin"; }
  else if (screen === "create-event") { body = CreateEventScreen(); active = "admin"; }
  else if (screen === "categories") { body = CategoriesScreen(); active = "admin"; }
  else if (screen === "manage-investments") { body = ManageInvestmentsScreen(); active = "admin"; }
  else if (screen === "edit-investment") { body = EditInvestmentScreen(); active = "admin"; }
  else if (screen === "manage-courses") { body = ManageCoursesScreen(); active = "admin"; }
  else if (screen === "edit-course") { body = EditCourseScreen(); active = "admin"; }
  else if (screen === "manage-events") { body = ManageEventsScreen(); active = "admin"; }
  else if (screen === "edit-event") { body = EditEventScreen(); active = "admin"; }
  else if (screen === "message-admin") body = MessageAdminScreen();
  else if (screen === "support-inbox") { body = SupportInboxScreen(); active = "admin"; }
  else if (screen === "admin-analytics") { body = AdminAnalyticsScreen(); active = "admin"; }
  else if (screen === "support-thread") { body = SupportThreadScreen(); active = "admin"; }
   else if (screen === "admin-guide-videos") { body = AdminGuideVideosScreen(); active = "admin"; }
  else if (screen === "admin-site-links") { body = AdminSiteLinksScreen(); active = "admin"; }
  else if (screen === "admin-all-accounts") { body = AdminAllAccountsScreen(); active = "admin"; }
  else if (screen === "admin-manage-admins") { body = AdminManageAdminsScreen(); active = "admin"; }
  else if (screen === "service-inquiry") body = ServiceInquiryScreen();
  else if (screen === "provider-inquiries") { body = ProviderInquiriesScreen(); active = "orders"; }
  else if (screen === "provider-inquiry-thread") { body = ProviderInquiryThreadScreen(); active = "orders"; }
  else if (screen === "bank-details") body = BankDetailsScreen();
  else if (screen === "settings") body = SettingsScreen();
  else if (screen === "security-settings") body = SecurityScreen();
  else if (screen === "privacy-settings") body = PrivacyScreen();
  else if (screen === "notification-settings") body = NotificationSettingsScreen();
  else if (screen === "guidelines") body = GuidelinesScreen();
  else if (screen === "terms") body = TermsScreen();
  else if (screen === "privacy-policy") body = PrivacyPolicyScreen();
  else if (screen === "refund-policy") body = RefundPolicyScreen();
  else if (screen === "provider-verification") body = ProviderVerificationScreen();
  else if (screen === "ceo-profile") body = CEOProfileScreen();
  else if (screen === "contact-support") body = ContactSupportScreen();
   else if (screen === "provider-resources") body = ProviderResourcesMenuScreen();
  else if (screen === "become-provider-guide") body = BecomeProviderGuideScreen();
  else if (screen === "ask-question-guide") body = AskQuestionGuideScreen();
  else if (screen === "how-to-sell") body = HowToSellScreen();
  else if (screen === "marketing-skills") body = MarketingSkillsScreen();
  else if (me.role === "admin" && !["profile", "home", "orders", "wallet"].includes(screen)) { body = AdminScreen(); active = "admin"; }
  else if (screen === "orders") body = OrdersScreen();
  else if (screen === "wallet") body = WalletScreen();
  else if (screen === "profile") body = ProfileScreen();
  else body = HomeScreen();

  const fullscreenModules = ["payment", "review", "dispute", "messages", "brand-media", "marketplace", "market-dashboard", "price-factors", "category-services", "notifications", "become-provider", "add-service", "my-services", "edit-service", "provider-profile", "request-name-change", "admin-name-change-requests", "feedback", "provider-feedback", "investments", "investment-detail", "my-investments", "academy", "course-detail", "my-courses", "events", "event-detail", "my-events", "grow-sessions", "grow-session-detail", "my-grow-sessions", "create-grow-session", "manage-grow-sessions", "edit-grow-session", "admin-grow-bookings", "create-investment", "create-course", "create-event", "categories", "manage-investments", "edit-investment", "manage-courses", "edit-course", "manage-events", "edit-event", "bank-details", "settings", "security-settings", "privacy-settings", "notification-settings", "guidelines", "terms", "privacy-policy", "refund-policy", "provider-verification", "ceo-profile", "contact-support", "message-admin", "support-inbox", "admin-analytics", "support-thread", "service-inquiry", "provider-inquiries", "provider-inquiry-thread", "admin-guide-videos", "admin-site-links", "admin-all-accounts", "admin-manage-admins", "provider-resources", "become-provider-guide", "ask-question-guide", "how-to-sell", "marketing-skills"];
  const hideNav = fullscreenModules.includes(screen);

  return (
    <Shell>
      <div style={{ flex: 1, overflowY: "auto" }}>{body}</div>
      {!hideNav && <BottomNav items={nav} active={active} onChange={setScreen} />}
      <Toast msg={toast} />
    </Shell>
  );
}

function Shell({ children }) {
  const isMobile = typeof window !== "undefined" && window.innerWidth < 500;
  return (
    <div style={{ width: isMobile ? "100vw" : 400, height: isMobile ? "100vh" : 780, maxWidth: isMobile ? "100%" : 400, margin: isMobile ? 0 : "20px auto", background: NAVY, color: "#fff", fontFamily: "'Helvetica Neue', Arial, sans-serif", borderRadius: isMobile ? 0 : 28, overflow: "hidden", display: "flex", flexDirection: "column", boxShadow: isMobile ? "none" : "0 20px 60px rgba(0,0,0,0.5)", border: isMobile ? "none" : "1px solid rgba(212,175,55,0.25)", position: "relative" }}>
      {children}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((e) => console.log("SW registration failed", e));

  }
</script>
</body>
