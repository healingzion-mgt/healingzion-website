<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Analytics | Healingzion MGT Admin</title>
<style>
  body {
    background-color: #0a1128;
    color: #d9dce3;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 30px 20px 80px; }
  h1 { color: #f4f1ea; font-size: 26px; margin-bottom: 4px; }
  .subtitle { color: #9aa1b5; font-size: 14px; margin-bottom: 30px; }

  .stats-row {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px;
  }
  .stat-card {
    background: #101a3a; border: 1px solid #24304f; border-left: 3px solid #d4af37;
    border-radius: 6px; padding: 16px 20px; flex: 1; min-width: 140px;
  }
  .stat-num { color: #f4f1ea; font-size: 26px; font-weight: bold; }
  .stat-label { color: #9aa1b5; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .panel {
    background: #101a3a; border: 1px solid #24304f; border-radius: 8px;
    padding: 20px; margin-bottom: 30px;
  }
  .panel h2 { color: #d4af37; font-size: 16px; margin: 0 0 16px; text-transform: uppercase; letter-spacing: 1px; }

  #chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 160px; overflow-x: auto; padding-bottom: 6px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; min-width: 26px; }
  .bar { width: 18px; background: linear-gradient(180deg, #d4af37, #a8842a); border-radius: 3px 3px 0 0; }
  .bar-day { color: #7d8399; font-size: 9px; margin-top: 6px; writing-mode: vertical-rl; transform: rotate(180deg); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #d4af37; padding: 8px 10px; border-bottom: 1px solid #24304f; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 8px 10px; border-bottom: 1px solid #1b2545; color: #c7cbd8; }
  tr:hover td { background: #0d1633; }

  .loading, .empty { color: #7d8399; font-style: italic; padding: 20px 0; text-align: center; }
  .refresh-btn {
    background: #d4af37; color: #0a1128; border: none; border-radius: 5px;
    padding: 8px 16px; font-weight: bold; font-size: 13px; cursor: pointer; float: right;
  }

  #login-gate {
    max-width: 360px; margin: 100px auto; text-align: center;
  }
  #login-gate h2 { color: #f4f1ea; font-size: 20px; margin-bottom: 20px; }
  #login-gate input {
    width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 5px;
    border: 1px solid #24304f; background: #101a3a; color: #f4f1ea; font-size: 14px;
    box-sizing: border-box;
  }
  #login-gate button {
    width: 100%; padding: 12px; background: #d4af37; color: #0a1128; border: none;
    border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  #login-error { color: #e07856; font-size: 13px; margin-top: 10px; min-height: 18px; }
  #dashboard-content { display: none; }
</style>
</head>
<body>

<div id="login-gate">
  <h2>Admin Access — Visitor Analytics</h2>
  <input type="email" id="admin-email" placeholder="Admin email" autocomplete="username">
  <input type="password" id="admin-password" placeholder="Password" autocomplete="current-password">
  <button onclick="attemptLogin()">Sign in</button>
  <div id="login-error"></div>
</div>

<div class="wrap" id="dashboard-content">

  <h1>Visitor Analytics</h1>
  <p class="subtitle">Live visits, locations, and daily trends for your site.</p>

  <div class="stats-row" id="stats-row">
    <div class="stat-card"><div class="stat-num" id="stat-today">—</div><div class="stat-label">Visits today</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-week">—</div><div class="stat-label">Last 7 days</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Last 100 logged</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-topcountry">—</div><div class="stat-label">Top country</div></div>
  </div>

  <div class="panel">
    <h2>Daily visits (last 30 days) <button class="refresh-btn" onclick="loadAll()">Refresh</button></h2>
    <div id="chart-bars"><div class="loading">Loading chart…</div></div>
  </div>

  <div class="panel">
    <h2>Recent visits</h2>
    <div id="table-wrap"><div class="loading">Loading visits…</div></div>
  </div>

</div>
</div>

<script>
const ADMIN_EMAIL = "oyibooyoma@gmail.com";

async function attemptLogin() {
  const email = document.getElementById('admin-email').value.trim().toLowerCase();
  const password = document.getElementById('admin-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  if (email !== ADMIN_EMAIL) {
    errEl.textContent = 'Access denied.';
    return;
  }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (data && data.tier === 'ENTERPRISE' && (data.email || '').toLowerCase() === ADMIN_EMAIL) {
      document.getElementById('login-gate').style.display = 'none';
      document.getElementById('dashboard-content').style.display = 'block';
      loadAll();
    } else {
      errEl.textContent = 'Access denied.';
    }
  } catch (e) {
    errEl.textContent = 'Login failed — check your connection and try again.';
  }
}

async function loadAll() {
  await Promise.all([loadSummary(), loadRecent()]);
}

async function loadSummary() {
  const chartEl = document.getElementById('chart-bars');
  try {
    const res = await fetch('/api/visits?summary=1');
    const data = await res.json();
    if (!data.ok || !data.summary || data.summary.length === 0) {
      chartEl.innerHTML = '<div class="empty">No visit data yet.</div>';
      updateStatCards([]);
      return;
    }
    const rows = data.summary.slice().reverse(); // oldest -> newest for chart order
    const max = Math.max(...rows.map(r => r.visits), 1);

    chartEl.innerHTML = rows.map(r => {
      const h = Math.max(4, Math.round((r.visits / max) * 140));
      const shortDay = r.day.slice(5); // MM-DD
      return `<div class="bar-col">
                <div class="bar" style="height:${h}px" title="${r.day}: ${r.visits} visits"></div>
                <div class="bar-day">${shortDay}</div>
              </div>`;
    }).join('');

    updateStatCards(data.summary);
  } catch (e) {
    chartEl.innerHTML = '<div class="empty">Could not load chart data.</div>';
  }
}

function updateStatCards(summary) {
  const todayStr = new Date().toISOString().slice(0,10);
  const today = summary.find(r => r.day === todayStr);
  document.getElementById('stat-today').textContent = today ? today.visits : 0;

  const weekTotal = summary.reduce((sum, r) => sum + r.visits, 0);
  document.getElementById('stat-week').textContent = weekTotal;
}

async function loadRecent() {
  const tableEl = document.getElementById('table-wrap');
  try {
    const res = await fetch('/api/visits');
    const data = await res.json();
    if (!data.ok || !data.visits || data.visits.length === 0) {
      tableEl.innerHTML = '<div class="empty">No visits logged yet.</div>';
      document.getElementById('stat-total').textContent = 0;
      document.getElementById('stat-topcountry').textContent = '—';
      return;
    }

    document.getElementById('stat-total').textContent = data.visits.length;

    const countryCounts = {};
    data.visits.forEach(v => {
      const c = v.country || 'Unknown';
      countryCounts[c] = (countryCounts[c] || 0) + 1;
    });
    const topCountry = Object.entries(countryCounts).sort((a,b) => b[1]-a[1])[0];
    document.getElementById('stat-topcountry').textContent = topCountry ? topCountry[0] : '—';

    const rows = data.visits.map(v => {
      const time = new Date(v.visited_at.replace(' ', 'T') + 'Z').toLocaleString();
      const loc = [v.city, v.region, v.country].filter(Boolean).join(', ') || 'Unknown';
      return `<tr>
                <td>${time}</td>
                <td>${v.page}</td>
                <td>${loc}</td>
                <td>${v.referrer || '—'}</td>
              </tr>`;
    }).join('');

    tableEl.innerHTML = `<table>
        <tr><th>Time</th><th>Page</th><th>Location</th><th>Referrer</th></tr>
        ${rows}
      </table>`;
  } catch (e) {
    tableEl.innerHTML = '<div class="empty">Could not load visit log.</div>';
  }
}

// Data loads only after attemptLogin() succeeds — see login gate above.
</script>

</body>
</html>
